# ---- Server ----
server.port=8080
server.address=127.0.0.1
spring.application.name=phishshield-backend

# ---- Database: H2 file database by default (no installation needed) ----
# To use PostgreSQL set these environment variables before starting:
#   DB_URL=jdbc:postgresql://localhost:5432/phishshield  DB_USER=...  DB_PASSWORD=...
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/phishshield}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=false
spring.sql.init.mode=never

# ---- Detection engine (Python FastAPI) ----
phishshield.engine.url=${ENGINE_URL:http://127.0.0.1:8000}

# ---- Auth ----
phishshield.auth.session-days=7
phishshield.demo-user.enabled=${DEMO_USER_ENABLED:true}
phishshield.demo-user.email=demo@phishshield.local
phishshield.demo-user.password=${DEMO_USER_PASSWORD:Demo@1234}

# ---- JSON / errors ----
spring.jackson.default-property-inclusion=non_null
server.error.include-message=never
server.error.include-stacktrace=never
logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
